services:
  - type: web
    name: ai-logistics-crm
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: freightdesk-data
      mountPath: /var/lib/freightdesk
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /var/lib/freightdesk/freightdesk.db
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_VOICE_API_KEY
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_APP_ID
        sync: false
      - key: SARVAM_CONNECTION_ID
        sync: false
      - key: SARVAM_AGENT_PHONE_NUMBER
        sync: false
      - key: SARVAM_WEBHOOK_URL
        sync: false
      - key: SARVAM_MODEL_BASE_URL
        value: https://api.sarvam.ai
      - key: SARVAM_MODEL
        value: saaras:v4
      - key: SARVAM_VENDOR_NAME
        value: David Transportation
      - key: SARVAM_VENDOR_PHONE
        value: "6385106931"
